<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña — SGPLOPyPC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/shared/tailwind-output.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="font-sans antialiased min-h-screen flex bg-slate-50">

  <div class="flex-1 flex flex-col items-center justify-center px-6 py-12">
    <a href="/" class="flex items-center gap-3 mb-10">
      <div class="w-10 h-10 rounded-xl bg-primary-700 flex items-center justify-center text-white font-bold text-base">SG</div>
      <div>
        <p class="font-bold text-slate-800 text-base leading-tight">SGPLOPyPC</p>
        <p class="text-xs text-slate-400">Contrataciones Públicas</p>
      </div>
    </a>

    <div class="w-full max-w-[380px]">
      <div class="mb-6">
        <h2 class="text-2xl font-extrabold text-slate-900">Restablecer contraseña</h2>
        <p class="text-slate-500 text-sm mt-1.5">Define tu nueva contraseña. Mínimo 8 caracteres, mayúscula, número y símbolo.</p>
      </div>

      <form id="reset-form" novalidate class="space-y-5">
        <div class="space-y-1.5">
          <label for="token" class="text-sm font-semibold text-slate-700">Token de recuperación</label>
          <div class="relative">
            <i class="ph ph-key absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-base pointer-events-none"></i>
            <input id="token" name="token" type="text" required placeholder="Pega el token recibido"
              class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all">
          </div>
        </div>

        <div class="space-y-1.5">
          <label for="password" class="text-sm font-semibold text-slate-700">Nueva contraseña</label>
          <div class="relative">
            <i class="ph ph-lock-simple absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-base pointer-events-none"></i>
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="••••••••"
              class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all">
          </div>
          <p id="pwd-hint" class="text-xs text-slate-400">Mínimo 8 caracteres, una mayúscula, un número y un símbolo.</p>
        </div>

        <div class="space-y-1.5">
          <label for="password-confirm" class="text-sm font-semibold text-slate-700">Confirmar contraseña</label>
          <div class="relative">
            <i class="ph ph-lock-simple absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-base pointer-events-none"></i>
            <input id="password-confirm" name="password-confirm" type="password" autocomplete="new-password" required minlength="8" placeholder="••••••••"
              class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all">
          </div>
        </div>

        <div id="feedback" class="hidden items-center gap-2.5 rounded-xl px-4 py-3 text-sm" role="alert"></div>

        <button id="submit-btn" type="submit"
          class="w-full flex items-center justify-center gap-2 bg-primary-600 hover:bg-primary-700 disabled:opacity-60 disabled:cursor-not-allowed text-white font-bold py-2.5 rounded-xl transition-colors duration-200 shadow-sm text-sm cursor-pointer">
          <i id="btn-icon" class="ph ph-check text-base"></i>
          <span id="btn-text">Restablecer contraseña</span>
        </button>
      </form>

      <div class="flex items-center gap-3 my-6" aria-hidden="true">
        <div class="flex-1 h-px bg-slate-200"></div>
        <span class="text-xs text-slate-400 font-medium">o</span>
        <div class="flex-1 h-px bg-slate-200"></div>
      </div>

      <a href="/frontend/auth/login.html" class="w-full flex items-center justify-center gap-2 border border-slate-200 hover:bg-slate-50 text-slate-600 font-semibold py-2.5 rounded-xl transition-colors duration-200 text-sm">
        <i class="ph ph-arrow-left text-base"></i>
        Volver a iniciar sesión
      </a>
    </div>
  </div>

  <script>
    const form = document.getElementById('reset-form');
    const tokenInput = document.getElementById('token');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('password-confirm');
    const feedback = document.getElementById('feedback');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');
    const pwdHint = document.getElementById('pwd-hint');

    // Extraer token de query param ?token=...
    const urlParams = new URLSearchParams(window.location.search);
    const tokenFromUrl = urlParams.get('token');
    if (tokenFromUrl) {
      tokenInput.value = tokenFromUrl;
      passwordInput.focus();
    }

    function passwordScore(value) {
      let score = 0;
      if (value.length >= 8) score++;
      if (/[A-Z]/.test(value)) score++;
      if (/[0-9]/.test(value)) score++;
      if (/[^A-Za-z0-9]/.test(value)) score++;
      return score;
    }

    passwordInput.addEventListener('input', function () {
      const score = passwordScore(passwordInput.value);
      pwdHint.textContent = score === 4 ? 'Contraseña válida' : 'Mínimo 8 caracteres, una mayúscula, un número y un símbolo.';
      pwdHint.className = 'text-xs ' + (score === 4 ? 'text-emerald-600' : 'text-slate-400');
    });

    function showFeedback(message, tone) {
      feedback.className = 'flex items-center gap-2.5 rounded-xl px-4 py-3 text-sm ' + (tone === 'error'
        ? 'bg-red-50 border border-red-200 text-red-700'
        : 'bg-emerald-50 border border-emerald-200 text-emerald-700');
      feedback.innerHTML = '<i class="ph ph-' + (tone === 'error' ? 'warning-circle' : 'check-circle') + ' text-base shrink-0"></i><span>' + message + '</span>';
      feedback.classList.remove('hidden');
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        btnIcon.className = 'ph ph-circle-notch text-base animate-spin';
        btnText.textContent = 'Restableciendo...';
      } else {
        btnIcon.className = 'ph ph-check text-base';
        btnText.textContent = 'Restablecer contraseña';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      feedback.classList.add('hidden');

      const token = tokenInput.value.trim();
      const newPassword = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (!token) {
        showFeedback('El token es obligatorio.', 'error');
        return;
      }
      if (passwordScore(newPassword) < 4) {
        showFeedback('La contraseña no cumple la política de seguridad.', 'error');
        return;
      }
      if (newPassword !== confirmPassword) {
        showFeedback('La confirmación de contraseña no coincide.', 'error');
        return;
      }

      setLoading(true);
      try {
        const response = await fetch('/api/v1/auth/password/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: newPassword }),
        });
        const payload = await response.json();
        if (!response.ok || !payload.success) {
          showFeedback(payload?.errors?.[0] || payload?.message || 'No se pudo restablecer la contraseña.', 'error');
          setLoading(false);
          return;
        }
        showFeedback('Contraseña restablecida exitosamente. Redirigiendo...', 'success');
        setTimeout(() => {
          window.location.href = '/frontend/auth/login.html';
        }, 1500);
      } catch (_) {
        showFeedback('No se pudo restablecer la contraseña por un error de red.', 'error');
        setLoading(false);
      }
    });
  </script>
  <script src="/frontend/shared/error-handler.js"></script>
</body>
</html>

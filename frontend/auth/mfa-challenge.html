<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación MFA — SGPLOPyPC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/shared/tailwind-output.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="font-sans antialiased min-h-screen bg-slate-50 flex items-center justify-center p-4">

<div class="w-full max-w-sm">
    <div class="text-center mb-8">
        <a href="/" class="inline-flex items-center gap-3 cursor-pointer">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-base" aria-hidden="true">SG</div>
            <div class="text-left">
                <p class="font-bold text-slate-900 text-base leading-tight">SGPLOPyPC</p>
                <p class="text-xs text-slate-500">Contrataciones Públicas</p>
            </div>
        </a>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm space-y-6">
        <div class="text-center">
            <div class="w-14 h-14 rounded-2xl bg-primary-50 text-primary-600 flex items-center justify-center mx-auto mb-4" aria-hidden="true">
                <i class="ph ph-shield-check text-3xl"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-900">Verificación de dos factores</h1>
            <p class="text-sm text-slate-500 mt-1">Ingresa el código de 6 dígitos de tu app de autenticación.</p>
        </div>

        <div>
            <label for="code-input" class="block text-sm font-semibold text-slate-700 mb-1.5">Código de verificación</label>
            <input type="text" id="code-input" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code"
                class="w-full border border-slate-200 rounded-xl px-4 py-3 text-center text-2xl font-mono tracking-widest focus:outline-none focus:ring-2 focus:ring-primary-500"
                placeholder="000000" autofocus>
            <p class="text-xs text-slate-400 mt-1.5 text-center">También puedes usar un código de respaldo de 8 caracteres.</p>
        </div>

        <div id="error-msg" class="hidden bg-red-50 border border-red-200 rounded-lg px-4 py-3 text-sm text-red-700"></div>

        <button id="btn-verify" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 rounded-xl text-sm cursor-pointer transition-colors">
            Verificar
        </button>

        <div class="text-center">
            <a href="/frontend/auth/login.html" class="text-sm text-slate-500 hover:text-slate-700 cursor-pointer">
                ← Volver al inicio de sesión
            </a>
        </div>
    </div>
</div>

<script>
(function () {
  const TOKEN_KEY = 'sgplopypc_token';
  const USER_KEY = 'sgplopypc_user';

  // El mfa_token viene en el hash de la URL: #mfa_token=...
  const hash = window.location.hash.slice(1);
  const params = new URLSearchParams(hash);
  const mfaToken = params.get('mfa_token');

  if (!mfaToken) {
    window.location.href = '/frontend/auth/login.html';
    return;
  }

  const els = {
    codeInput: document.getElementById('code-input'),
    btnVerify: document.getElementById('btn-verify'),
    errorMsg: document.getElementById('error-msg'),
  };

  async function verify() {
    const code = els.codeInput.value.trim();
    if (!code) {
      els.errorMsg.textContent = 'Ingresa el código.';
      els.errorMsg.classList.remove('hidden');
      return;
    }
    els.btnVerify.disabled = true;
    els.btnVerify.textContent = 'Verificando...';
    els.errorMsg.classList.add('hidden');

    try {
      const res = await fetch('/api/v1/auth/login/mfa', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mfa_token: mfaToken, code }),
      });
      const body = await res.json();
      if (!res.ok) {
        els.errorMsg.textContent = (body.errors && body.errors[0]) || body.message || 'Código incorrecto.';
        els.errorMsg.classList.remove('hidden');
        els.btnVerify.disabled = false;
        els.btnVerify.textContent = 'Verificar';
        els.codeInput.value = '';
        els.codeInput.focus();
        return;
      }

      // Guardar sesión y redirigir
      localStorage.setItem(TOKEN_KEY, body.data.token);
      localStorage.setItem(USER_KEY, JSON.stringify(body.data.usuario));
      const rol = body.data.usuario.rol;
      if (rol === 'ADMINISTRADOR') {
        window.location.href = '/frontend/admin/dashboard.html';
      } else if (rol === 'PROVEEDOR') {
        window.location.href = '/frontend/proveedor/centro.html';
      } else {
        window.location.href = '/frontend/publico/centro.html';
      }
    } catch (e) {
      els.errorMsg.textContent = 'Error de red. Intenta de nuevo.';
      els.errorMsg.classList.remove('hidden');
      els.btnVerify.disabled = false;
      els.btnVerify.textContent = 'Verificar';
    }
  }

  els.btnVerify.addEventListener('click', verify);
  els.codeInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') verify();
  });
})();
</script>
  <script src="/frontend/shared/error-handler.js"></script>
</body>
</html>

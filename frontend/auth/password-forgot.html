<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña — SGPLOPyPC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/shared/tailwind-output.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="font-sans antialiased min-h-screen flex bg-slate-50">

  <div class="flex-1 flex flex-col items-center justify-center px-6 py-12">
    <a href="/" class="flex items-center gap-3 mb-10">
      <div class="w-10 h-10 rounded-xl bg-primary-700 flex items-center justify-center text-white font-bold text-base">SG</div>
      <div>
        <p class="font-bold text-slate-800 text-base leading-tight">SGPLOPyPC</p>
        <p class="text-xs text-slate-400">Contrataciones Públicas</p>
      </div>
    </a>

    <div class="w-full max-w-[380px]">
      <div class="mb-6">
        <h2 class="text-2xl font-extrabold text-slate-900">Recuperar contraseña</h2>
        <p class="text-slate-500 text-sm mt-1.5">Ingresa tu correo y te enviaremos instrucciones para restablecer tu contraseña.</p>
      </div>

      <form id="forgot-form" novalidate class="space-y-5">
        <div class="space-y-1.5">
          <label for="email" class="text-sm font-semibold text-slate-700">Correo electrónico</label>
          <div class="relative">
            <i class="ph ph-envelope-simple absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-base pointer-events-none"></i>
            <input id="email" name="email" type="email" autocomplete="email" required placeholder="correo@ejemplo.com"
              class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all">
          </div>
        </div>

        <div id="feedback" class="hidden items-center gap-2.5 rounded-xl px-4 py-3 text-sm" role="alert"></div>

        <button id="submit-btn" type="submit"
          class="w-full flex items-center justify-center gap-2 bg-primary-600 hover:bg-primary-700 disabled:opacity-60 disabled:cursor-not-allowed text-white font-bold py-2.5 rounded-xl transition-colors duration-200 shadow-sm text-sm cursor-pointer">
          <i id="btn-icon" class="ph ph-paper-plane-right text-base"></i>
          <span id="btn-text">Enviar instrucciones</span>
        </button>
      </form>

      <div class="flex items-center gap-3 my-6" aria-hidden="true">
        <div class="flex-1 h-px bg-slate-200"></div>
        <span class="text-xs text-slate-400 font-medium">o</span>
        <div class="flex-1 h-px bg-slate-200"></div>
      </div>

      <a href="/frontend/auth/login.html" class="w-full flex items-center justify-center gap-2 border border-slate-200 hover:bg-slate-50 text-slate-600 font-semibold py-2.5 rounded-xl transition-colors duration-200 text-sm">
        <i class="ph ph-arrow-left text-base"></i>
        Volver a iniciar sesión
      </a>
    </div>
  </div>

  <script>
    const form = document.getElementById('forgot-form');
    const emailInput = document.getElementById('email');
    const feedback = document.getElementById('feedback');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');

    function showFeedback(message, tone) {
      feedback.className = 'flex items-center gap-2.5 rounded-xl px-4 py-3 text-sm ' + (tone === 'error'
        ? 'bg-red-50 border border-red-200 text-red-700'
        : 'bg-emerald-50 border border-emerald-200 text-emerald-700');
      feedback.innerHTML = '<i class="ph ph-' + (tone === 'error' ? 'warning-circle' : 'check-circle') + ' text-base shrink-0"></i><span>' + message + '</span>';
      feedback.classList.remove('hidden');
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        btnIcon.className = 'ph ph-circle-notch text-base animate-spin';
        btnText.textContent = 'Enviando...';
      } else {
        btnIcon.className = 'ph ph-paper-plane-right text-base';
        btnText.textContent = 'Enviar instrucciones';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      feedback.classList.add('hidden');

      const email = emailInput.value.trim().toLowerCase();
      if (!email) {
        showFeedback('Ingresa un correo electrónico válido.', 'error');
        return;
      }

      setLoading(true);
      try {
        const response = await fetch('/api/v1/auth/password/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const payload = await response.json();
        showFeedback(payload?.message || 'Si el correo existe, recibirás instrucciones para restablecer tu contraseña.', 'success');
        emailInput.value = '';
      } catch (_) {
        showFeedback('No se pudo procesar la solicitud en este momento.', 'error');
      } finally {
        setLoading(false);
      }
    });
  </script>
  <script src="/frontend/shared/error-handler.js"></script>
</body>
</html>

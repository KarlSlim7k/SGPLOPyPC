<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soporte — SGPLOPyPC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: { primary: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/frontend/proveedor/centro.html" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-primary-700 text-white flex items-center justify-center font-bold text-sm">SG</div>
        <div>
          <p class="font-bold text-sm">SGPLOPyPC</p>
          <p class="text-xs text-slate-500">Soporte</p>
        </div>
      </a>
      <div class="flex items-center gap-2">
        <a href="/frontend/proveedor/convocatorias.html" class="hidden sm:inline-flex items-center gap-2 text-sm font-semibold px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-50">
          <i class="ph ph-megaphone"></i>
          Convocatorias
        </a>
        <a href="/frontend/proveedor/centro.html" class="inline-flex items-center gap-2 text-sm font-semibold px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-50">
          <i class="ph ph-house"></i>
          Centro
        </a>
        <a href="/frontend/proveedor/notificaciones.html" data-notif-badge class="relative inline-flex items-center gap-2 text-sm font-semibold px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-50">
          <i class="ph ph-bell"></i>
          <span class="notif-badge-count hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
        </a>
        <button data-action="back" class="inline-flex items-center gap-2 text-sm font-semibold px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-50" aria-label="Regresar">
          <i class="ph ph-arrow-left"></i>
          Atr&aacute;s
        </button>
        <button data-action="logout" class="inline-flex items-center gap-2 text-sm font-semibold px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-50">
          <i class="ph ph-sign-out"></i>
          Cerrar sesi&oacute;n
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
    <!-- Header -->
    <section class="bg-white border border-slate-200 rounded-2xl p-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <p class="text-xs uppercase tracking-wide text-primary-700 font-semibold">Rol Proveedor</p>
          <h1 class="text-2xl font-bold mt-1">Soporte</h1>
          <p class="text-slate-500 text-sm mt-2">Crea tickets de soporte y consulta el hilo de respuestas.</p>
        </div>
        <button id="btn-nuevo-ticket" class="inline-flex items-center gap-2 text-sm font-semibold px-4 py-2 rounded-lg bg-primary-600 text-white hover:bg-primary-700">
          <i class="ph ph-plus"></i>
          Nuevo ticket
        </button>
      </div>
    </section>

    <!-- Stats -->
    <section id="stats-section" class="grid grid-cols-2 md:grid-cols-4 gap-4 hidden">
      <div class="bg-white border border-slate-200 rounded-xl p-4 text-center">
        <p class="text-2xl font-bold text-slate-800" id="stat-total">0</p>
        <p class="text-xs text-slate-500 font-medium mt-1">Total</p>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-4 text-center">
        <p class="text-2xl font-bold text-emerald-600" id="stat-abiertos">0</p>
        <p class="text-xs text-slate-500 font-medium mt-1">Abiertos</p>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-4 text-center">
        <p class="text-2xl font-bold text-blue-600" id="stat-en-proceso">0</p>
        <p class="text-xs text-slate-500 font-medium mt-1">En proceso</p>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-4 text-center">
        <p class="text-2xl font-bold text-slate-600" id="stat-cerrados">0</p>
        <p class="text-xs text-slate-500 font-medium mt-1">Cerrados / Resueltos</p>
      </div>
    </section>

    <!-- New ticket form -->
    <section id="form-section" class="bg-white border border-slate-200 rounded-2xl p-6 hidden">
      <h2 class="font-bold text-lg mb-4">Nuevo ticket</h2>
      <form id="ticket-form" class="space-y-4 max-w-2xl">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Asunto</label>
          <input type="text" id="ticket-asunto" maxlength="200" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="Ej. No puedo subir documentos">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Descripci&oacute;n</label>
          <textarea id="ticket-descripcion" rows="4" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="Describe el problema con el mayor detalle posible..."></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Prioridad</label>
          <select id="ticket-prioridad" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
            <option value="BAJA">Baja</option>
            <option value="MEDIA" selected>Media</option>
            <option value="ALTA">Alta</option>
            <option value="URGENTE">Urgente</option>
          </select>
        </div>
        <div class="flex items-center gap-3">
          <button type="submit" id="btn-crear" class="inline-flex items-center gap-2 text-sm font-semibold px-4 py-2 rounded-lg bg-primary-600 text-white hover:bg-primary-700">
            <i class="ph ph-paper-plane-right"></i>
            Crear ticket
          </button>
          <button type="button" id="btn-cancelar" class="inline-flex items-center gap-2 text-sm font-semibold px-4 py-2 rounded-lg border border-slate-200 hover:bg-slate-50">
            Cancelar
          </button>
        </div>
        <div id="form-alert" class="hidden border rounded-xl px-4 py-3 text-sm"></div>
      </form>
    </section>

    <!-- Tickets list -->
    <section class="bg-white border border-slate-200 rounded-2xl p-6">
      <h2 class="font-bold text-lg mb-4">Mis tickets</h2>
      <div id="tickets-empty" class="hidden py-8 text-center">
        <i class="ph ph-ticket text-4xl text-slate-300 mb-3"></i>
        <p class="text-sm text-slate-500">No tienes tickets de soporte.</p>
        <button id="btn-empty-nuevo" class="mt-3 inline-flex items-center gap-2 text-sm font-semibold px-4 py-2 rounded-lg bg-primary-600 text-white hover:bg-primary-700">
          <i class="ph ph-plus"></i>
          Crear uno
        </button>
      </div>
      <div id="tickets-list" class="space-y-3"></div>
      <div id="tickets-pagination" class="mt-4 flex items-center justify-between text-sm hidden">
        <span id="tickets-meta" class="text-slate-500"></span>
        <div class="flex items-center gap-2" id="tickets-pages"></div>
      </div>
    </section>

    <!-- Ticket detail -->
    <section id="detail-section" class="bg-white border border-slate-200 rounded-2xl p-6 hidden space-y-6">
      <div class="flex items-start justify-between gap-4">
        <div>
          <button id="btn-back-list" class="text-xs font-semibold text-primary-600 hover:text-primary-700 underline mb-2">&larr; Volver a la lista</button>
          <h2 id="detail-asunto" class="text-xl font-bold"></h2>
          <div class="flex flex-wrap items-center gap-2 mt-2">
            <span id="detail-estado" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold border"></span>
            <span id="detail-prioridad" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold border"></span>
            <span id="detail-fecha" class="text-xs text-slate-500"></span>
          </div>
        </div>
      </div>
      <div class="border-l-4 border-slate-200 pl-4 py-2 bg-slate-50 rounded-r-lg">
        <p id="detail-descripcion" class="text-sm text-slate-700 whitespace-pre-wrap"></p>
      </div>

      <!-- Responses -->
      <div>
        <h3 class="font-semibold text-sm text-slate-700 mb-3">Hilo de respuestas</h3>
        <div id="respuestas-list" class="space-y-3"></div>
        <div id="respuestas-empty" class="hidden py-4 text-center text-sm text-slate-500">
          <i class="ph ph-chat-teardrop-text text-3xl text-slate-300 mb-2"></i>
          <p>Sin respuestas a&uacute;n.</p>
        </div>
      </div>

      <!-- Reply form -->
      <form id="respuesta-form" class="space-y-3 max-w-2xl">
        <label class="block text-sm font-medium text-slate-700">Agregar respuesta</label>
        <textarea id="respuesta-mensaje" rows="3" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="Escribe tu respuesta..."></textarea>
        <div class="flex items-center gap-3">
          <button type="submit" id="btn-responder" class="inline-flex items-center gap-2 text-sm font-semibold px-4 py-2 rounded-lg bg-primary-600 text-white hover:bg-primary-700">
            <i class="ph ph-paper-plane-right"></i>
            Enviar respuesta
          </button>
        </div>
        <div id="respuesta-alert" class="hidden border rounded-xl px-4 py-3 text-sm"></div>
      </form>
    </section>
  </main>

  <script src="/frontend/shared/admin.js"></script>
  <script src="/frontend/shared/notif-stream.js"></script>
  <script src="/frontend/shared/notif-badge-toast.js"></script>
  <script>
    SGPLAdmin.attachLogoutHandlers();
    SGPLNotifBadge.init();
    SGPLAdmin.attachBackButton();

    let currentPage = 1;
    let currentTicketId = null;

    function setAlert(id, message, type) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = message;
      el.className = message ? 'border rounded-xl px-4 py-3 text-sm ' + (type === 'error' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200') : 'hidden';
    }

    function setBusy(id, busy, text) {
      const btn = document.getElementById(id);
      if (!btn) return;
      if (busy) {
        btn.dataset.originalText = btn.dataset.originalText || btn.innerHTML;
        btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> ' + (text || 'Cargando...');
        btn.disabled = true;
      } else {
        btn.innerHTML = btn.dataset.originalText || btn.innerHTML;
        btn.disabled = false;
      }
    }

    function estadoClass(estado) {
      switch (estado) {
        case 'ABIERTO': return 'bg-emerald-50 text-emerald-700 border-emerald-200';
        case 'EN_PROCESO': return 'bg-blue-50 text-blue-700 border-blue-200';
        case 'RESUELTO': return 'bg-amber-50 text-amber-700 border-amber-200';
        case 'CERRADO': return 'bg-slate-100 text-slate-600 border-slate-200';
        default: return 'bg-slate-100 text-slate-600 border-slate-200';
      }
    }

    function prioridadClass(prioridad) {
      switch (prioridad) {
        case 'BAJA': return 'bg-slate-100 text-slate-600 border-slate-200';
        case 'MEDIA': return 'bg-blue-50 text-blue-700 border-blue-200';
        case 'ALTA': return 'bg-amber-50 text-amber-700 border-amber-200';
        case 'URGENTE': return 'bg-red-50 text-red-700 border-red-200';
        default: return 'bg-slate-100 text-slate-600 border-slate-200';
      }
    }

    async function loadTickets(page = 1) {
      currentPage = page;
      setBusy('btn-nuevo-ticket', true, 'Cargando...');
      try {
        const res = await SGPLAdmin.authFetch('/tickets/mios?page=' + page + '&per_page=10');
        const data = (res && res.data) || { items: [], total: 0, total_pages: 1, resumen: {} };
        const items = data.items || [];
        const resumen = data.resumen || {};

        // Stats
        const statsSection = document.getElementById('stats-section');
        if (items.length > 0 || resumen.total > 0) {
          statsSection.classList.remove('hidden');
          document.getElementById('stat-total').textContent = resumen.total || 0;
          document.getElementById('stat-abiertos').textContent = resumen.abiertos || 0;
          document.getElementById('stat-en-proceso').textContent = resumen.en_proceso || 0;
          document.getElementById('stat-cerrados').textContent = (resumen.resueltos || 0) + (resumen.cerrados || 0);
        } else {
          statsSection.classList.add('hidden');
        }

        // List
        const listEl = document.getElementById('tickets-list');
        const emptyEl = document.getElementById('tickets-empty');
        if (items.length === 0) {
          listEl.innerHTML = '';
          emptyEl.classList.remove('hidden');
          document.getElementById('tickets-pagination').classList.add('hidden');
        } else {
          emptyEl.classList.add('hidden');
          listEl.innerHTML = items.map(function (t) {
            return '<div class="border border-slate-200 rounded-xl p-4 hover:bg-slate-50 cursor-pointer" data-ticket-id="' + t.id_ticket + '">'
              + '<div class="flex items-start justify-between gap-3">'
              + '<div class="min-w-0">'
              + '<p class="font-semibold text-sm text-slate-800 truncate">' + (t.asunto || '') + '</p>'
              + '<p class="text-xs text-slate-500 mt-1 line-clamp-2">' + (t.descripcion || '').substring(0, 120) + (t.descripcion && t.descripcion.length > 120 ? '...' : '') + '</p>'
              + '</div>'
              + '<div class="flex flex-col items-end gap-1 shrink-0">'
              + '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold border ' + estadoClass(t.estado) + '">' + t.estado + '</span>'
              + '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold border ' + prioridadClass(t.prioridad) + '">' + t.prioridad + '</span>'
              + '</div>'
              + '</div>'
              + '<p class="text-xs text-slate-400 mt-2">' + new Date(t.fecha_creacion).toLocaleDateString('es-MX') + '</p>'
              + '</div>';
          }).join('');

          // Click handlers
          listEl.querySelectorAll('[data-ticket-id]').forEach(function (el) {
            el.addEventListener('click', function () {
              openDetail(parseInt(el.dataset.ticketId));
            });
          });

          // Pagination
          const pagEl = document.getElementById('tickets-pagination');
          const pagesEl = document.getElementById('tickets-pages');
          const metaEl = document.getElementById('tickets-meta');
          const totalPages = data.total_pages || 1;
          if (totalPages > 1) {
            pagEl.classList.remove('hidden');
            metaEl.textContent = 'P&aacute;gina ' + data.page + ' de ' + totalPages;
            let pagesHtml = '';
            if (data.page > 1) {
              pagesHtml += '<button data-page="' + (data.page - 1) + '" class="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-50 text-xs font-medium">Anterior</button>';
            }
            if (data.page < totalPages) {
              pagesHtml += '<button data-page="' + (data.page + 1) + '" class="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-50 text-xs font-medium">Siguiente</button>';
            }
            pagesEl.innerHTML = pagesHtml;
            pagesEl.querySelectorAll('button[data-page]').forEach(function (b) {
              b.addEventListener('click', function () {
                loadTickets(parseInt(b.dataset.page));
              });
            });
          } else {
            pagEl.classList.add('hidden');
          }
        }
      } catch (error) {
        console.error('Error cargando tickets:', error);
      } finally {
        setBusy('btn-nuevo-ticket', false);
      }
    }

    async function openDetail(id) {
      currentTicketId = id;
      document.getElementById('form-section').classList.add('hidden');
      document.getElementById('detail-section').classList.remove('hidden');
      document.getElementById('respuestas-list').innerHTML = '';
      document.getElementById('respuestas-empty').classList.add('hidden');
      setAlert('respuesta-alert', '');

      try {
        const res = await SGPLAdmin.authFetch('/tickets/' + id);
        const t = (res && res.data) || null;
        if (!t) return;

        document.getElementById('detail-asunto').textContent = t.asunto || '';
        document.getElementById('detail-descripcion').textContent = t.descripcion || '';
        document.getElementById('detail-fecha').textContent = 'Creado: ' + new Date(t.fecha_creacion).toLocaleDateString('es-MX');

        const estadoBadge = document.getElementById('detail-estado');
        estadoBadge.className = 'inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold border ' + estadoClass(t.estado);
        estadoBadge.innerHTML = '<i class="ph ph-circle"></i> ' + t.estado;

        const prioridadBadge = document.getElementById('detail-prioridad');
        prioridadBadge.className = 'inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold border ' + prioridadClass(t.prioridad);
        prioridadBadge.innerHTML = '<i class="ph ph-flag"></i> ' + t.prioridad;

        const respuestas = t.respuestas || [];
        const respList = document.getElementById('respuestas-list');
        if (respuestas.length === 0) {
          document.getElementById('respuestas-empty').classList.remove('hidden');
        } else {
          document.getElementById('respuestas-empty').classList.add('hidden');
          respList.innerHTML = respuestas.map(function (r) {
            const isAdmin = r.usuario_rol === 'ADMINISTRADOR';
            return '<div class="flex gap-3 ' + (isAdmin ? 'flex-row' : 'flex-row-reverse') + '">'
              + '<div class="w-8 h-8 rounded-full ' + (isAdmin ? 'bg-primary-100 text-primary-700' : 'bg-slate-100 text-slate-600') + ' flex items-center justify-center shrink-0 text-xs font-bold">' + (r.usuario_nombre ? r.usuario_nombre.charAt(0).toUpperCase() : '?') + '</div>'
              + '<div class="max-w-xl ' + (isAdmin ? 'bg-primary-50 border-primary-100' : 'bg-slate-50 border-slate-200') + ' border rounded-xl px-4 py-3">'
              + '<p class="text-xs font-semibold ' + (isAdmin ? 'text-primary-700' : 'text-slate-600') + '">' + (r.usuario_nombre || 'Usuario') + (isAdmin ? ' (Soporte)' : '') + '</p>'
              + '<p class="text-sm text-slate-700 mt-1 whitespace-pre-wrap">' + (r.mensaje || '') + '</p>'
              + '<p class="text-xs text-slate-400 mt-1">' + new Date(r.fecha).toLocaleString('es-MX') + '</p>'
              + '</div>'
              + '</div>';
          }).join('');
        }
      } catch (error) {
        console.error('Error cargando detalle:', error);
      }
    }

    // Toggle form
    document.getElementById('btn-nuevo-ticket').addEventListener('click', function () {
      document.getElementById('form-section').classList.remove('hidden');
      document.getElementById('detail-section').classList.add('hidden');
      document.getElementById('ticket-asunto').focus();
    });
    document.getElementById('btn-empty-nuevo').addEventListener('click', function () {
      document.getElementById('form-section').classList.remove('hidden');
      document.getElementById('detail-section').classList.add('hidden');
      document.getElementById('ticket-asunto').focus();
    });
    document.getElementById('btn-cancelar').addEventListener('click', function () {
      document.getElementById('form-section').classList.add('hidden');
      document.getElementById('ticket-form').reset();
      setAlert('form-alert', '');
    });
    document.getElementById('btn-back-list').addEventListener('click', function () {
      document.getElementById('detail-section').classList.add('hidden');
      currentTicketId = null;
    });

    // Create ticket
    document.getElementById('ticket-form').addEventListener('submit', async function (event) {
      event.preventDefault();
      setAlert('form-alert', '');
      setBusy('btn-crear', true, 'Creando...');
      try {
        await SGPLAdmin.authFetch('/tickets', {
          method: 'POST',
          body: JSON.stringify({
            asunto: document.getElementById('ticket-asunto').value.trim(),
            descripcion: document.getElementById('ticket-descripcion').value.trim(),
            prioridad: document.getElementById('ticket-prioridad').value,
          }),
        });
        event.target.reset();
        document.getElementById('form-section').classList.add('hidden');
        await loadTickets(1);
      } catch (error) {
        setAlert('form-alert', error.message || 'No se pudo crear el ticket.', 'error');
      } finally {
        setBusy('btn-crear', false);
      }
    });

    // Add response
    document.getElementById('respuesta-form').addEventListener('submit', async function (event) {
      event.preventDefault();
      if (!currentTicketId) return;
      setAlert('respuesta-alert', '');
      setBusy('btn-responder', true, 'Enviando...');
      try {
        await SGPLAdmin.authFetch('/tickets/' + currentTicketId + '/respuestas', {
          method: 'POST',
          body: JSON.stringify({
            mensaje: document.getElementById('respuesta-mensaje').value.trim(),
          }),
        });
        event.target.reset();
        await openDetail(currentTicketId);
      } catch (error) {
        setAlert('respuesta-alert', error.message || 'No se pudo enviar la respuesta.', 'error');
      } finally {
        setBusy('btn-responder', false);
      }
    });

    (async function init() {
      if (!SGPLAdmin.protectRoute()) return;
      try {
        await loadTickets(1);
      } catch (error) {
        console.error('Error inicializando soporte:', error);
      }
    })();
  </script>
</body>
</html>

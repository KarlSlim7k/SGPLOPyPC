<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Notificaciones - SGPLOPyPC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: { primary: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      <a href="/frontend/proveedor/centro.html" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-primary-700 text-white flex items-center justify-center font-bold text-sm">SG</div>
        <div>
          <p class="font-bold text-sm">SGPLOPyPC</p>
          <p class="text-xs text-slate-500">Mis notificaciones</p>
        </div>
      </a>
      <div class="flex flex-wrap items-center gap-2">
        <a href="/frontend/proveedor/convocatorias.html" class="inline-flex items-center gap-2 text-sm font-semibold px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-50">
          <i class="ph ph-megaphone"></i>
          Convocatorias
        </a>
        <a href="/frontend/proveedor/propuestas.html" class="inline-flex items-center gap-2 text-sm font-semibold px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-50">
          <i class="ph ph-file-text"></i>
          Propuestas
        </a>
        <a href="/frontend/proveedor/contratos.html" class="inline-flex items-center gap-2 text-sm font-semibold px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-50">
          <i class="ph ph-handshake"></i>
          Contratos
        </a>
        <button data-action="logout" class="inline-flex items-center gap-2 text-sm font-semibold px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-50">
          <i class="ph ph-sign-out"></i>
          Cerrar sesión
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
    <section class="bg-white border border-slate-200 rounded-2xl p-6">
      <div class="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-4">
        <div>
          <p class="text-xs uppercase tracking-wide text-primary-700 font-semibold">Rol Proveedor</p>
          <h1 class="text-2xl font-bold mt-1">Mis notificaciones</h1>
          <p class="text-slate-500 text-sm mt-2">Consulta avisos operativos y entra directo al proceso relacionado cuando exista vínculo disponible.</p>
        </div>
        <button id="mark-visible-read" class="inline-flex items-center justify-center gap-2 bg-primary-600 hover:bg-primary-700 text-white font-semibold px-4 py-2 rounded-lg text-sm disabled:opacity-60">
          <i class="ph ph-checks"></i>
          Marcar visibles como leídas
        </button>
      </div>
      <p id="flash" class="hidden mt-4 text-sm rounded-lg px-3 py-2"></p>
    </section>

    <section class="grid md:grid-cols-3 gap-3">
      <div class="bg-white border border-slate-200 rounded-xl p-4">
        <p class="text-xs text-slate-500">Total</p>
        <p id="stat-total" class="text-2xl font-bold text-slate-900 mt-1">0</p>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-4">
        <p class="text-xs text-slate-500">No leídas</p>
        <p id="stat-unread" class="text-2xl font-bold text-slate-900 mt-1">0</p>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-4">
        <p class="text-xs text-slate-500">Con acción</p>
        <p id="stat-actionable" class="text-2xl font-bold text-slate-900 mt-1">0</p>
      </div>
    </section>

    <section class="bg-white border border-slate-200 rounded-2xl p-4 md:p-5">
      <form id="filters-form" class="grid md:grid-cols-[1fr_220px_180px] gap-3">
        <input id="f-q" type="search" placeholder="Buscar por título, mensaje, licitación o contrato..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
        <select id="f-estado" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-primary-500">
          <option value="">Todas</option>
          <option value="no_leidas">No leídas</option>
          <option value="leidas">Leídas</option>
        </select>
        <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold px-3 py-2 rounded-lg text-sm">
          Aplicar filtros
        </button>
      </form>
    </section>

    <section class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
      <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between">
        <p class="font-semibold text-slate-800">Bandeja</p>
        <p id="summary" class="text-xs text-slate-500">Cargando...</p>
      </div>
      <div id="rows" class="divide-y divide-slate-100">
        <div class="px-6 py-8 text-sm text-center text-slate-500">Cargando notificaciones...</div>
      </div>
    </section>
  </main>

  <script src="/frontend/shared/admin.js"></script>
  <script>
    SGPLAdmin.attachLogoutHandlers();
    let notificaciones = [];
    let visibles = [];

    function badgeClass(tipo) {
      if (tipo === 'ADJUDICACION') return 'bg-emerald-50 text-emerald-700 border-emerald-100';
      if (tipo === 'RESULTADO_EVALUACION') return 'bg-blue-50 text-blue-700 border-blue-100';
      if (tipo === 'ACLARACION') return 'bg-amber-50 text-amber-700 border-amber-100';
      if (tipo === 'CAMBIO_ESTADO') return 'bg-violet-50 text-violet-700 border-violet-100';
      return 'bg-slate-100 text-slate-700 border-slate-200';
    }

    function badge(tipo) {
      return '<span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-semibold border ' + badgeClass(tipo) + '">' + SGPLAdmin.escapeHtml(tipo || 'GENERAL') + '</span>';
    }

    function setFlash(message, tone) {
      const flash = document.getElementById('flash');
      flash.className = 'mt-4 text-sm rounded-lg px-3 py-2 ' + (tone === 'ok'
        ? 'bg-emerald-50 border border-emerald-200 text-emerald-700'
        : 'bg-red-50 border border-red-200 text-red-700');
      flash.textContent = message;
      flash.classList.remove('hidden');
    }

    function linkFallback(item) {
      if (item.accion_principal) return item.accion_principal;
      if (item.id_contrato) {
        return { label: 'Ver contrato', href: '/frontend/proveedor/contrato.html?id=' + String(item.id_contrato) };
      }
      if (item.id_propuesta) {
        return { label: 'Ver propuesta', href: '/frontend/proveedor/propuestas.html?id_propuesta=' + String(item.id_propuesta) };
      }
      if (item.id_licitacion) {
        return { label: 'Ver licitación', href: '/frontend/proveedor/licitacion.html?id=' + String(item.id_licitacion) };
      }
      return null;
    }

    function matchesSearch(item, query) {
      if (!query) return true;
      const source = [
        item.titulo,
        item.mensaje,
        item.numero_licitacion,
        item.descripcion_proyecto,
        item.dependencia_nombre,
        item.numero_contrato,
        item.tipo_notificacion
      ].join(' ').toLowerCase();
      return source.includes(query);
    }

    function updateStats() {
      document.getElementById('stat-total').textContent = String(notificaciones.length);
      document.getElementById('stat-unread').textContent = String(notificaciones.filter(function (item) { return !item.leida; }).length);
      document.getElementById('stat-actionable').textContent = String(notificaciones.filter(function (item) { return !!linkFallback(item); }).length);
    }

    function render() {
      const rows = document.getElementById('rows');
      const summary = document.getElementById('summary');
      const query = document.getElementById('f-q').value.trim().toLowerCase();
      const estado = document.getElementById('f-estado').value;

      visibles = notificaciones.filter(function (item) {
        if (estado === 'no_leidas' && item.leida) return false;
        if (estado === 'leidas' && !item.leida) return false;
        return matchesSearch(item, query);
      });

      summary.textContent = 'Mostrando ' + visibles.length + ' de ' + notificaciones.length;
      document.getElementById('mark-visible-read').disabled = !visibles.some(function (item) { return !item.leida; });
      updateStats();

      if (!visibles.length) {
        rows.innerHTML = '<div class="px-6 py-8 text-sm text-center text-slate-500">Sin notificaciones para los filtros seleccionados.</div>';
        return;
      }

      rows.innerHTML = visibles.map(function (item) {
        const action = linkFallback(item);
        const estadoLectura = item.leida
          ? '<span class="text-xs font-semibold text-slate-400">Leída</span>'
          : '<span class="text-xs font-semibold text-primary-700">No leída</span>';
        const actionHtml = action
          ? '<a data-open-action="' + String(item.id_notificacion) + '" href="' + SGPLAdmin.escapeHtml(action.href) + '" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-semibold border border-slate-200 hover:bg-slate-50"><i class="ph ph-arrow-square-out"></i>' + SGPLAdmin.escapeHtml(action.label) + '</a>'
          : '<span class="text-xs text-slate-400">Sin acción disponible</span>';
        const markButton = item.leida
          ? ''
          : '<button data-mark-read="' + String(item.id_notificacion) + '" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-semibold border border-slate-200 hover:bg-slate-50"><i class="ph ph-check"></i>Marcar leída</button>';

        return '<article class="px-6 py-5 ' + (item.leida ? 'bg-white' : 'bg-blue-50/35') + '">'
          + '<div class="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-4">'
          + '<div class="min-w-0">'
          + '<div class="flex flex-wrap items-center gap-2">' + badge(item.tipo_notificacion) + estadoLectura + '</div>'
          + '<h2 class="font-bold text-slate-900 mt-2">' + SGPLAdmin.escapeHtml(item.titulo || 'Notificación') + '</h2>'
          + '<p class="text-sm text-slate-600 mt-2 leading-relaxed">' + SGPLAdmin.escapeHtml(item.mensaje || '') + '</p>'
          + '<p class="text-xs text-slate-500 mt-3">' + SGPLAdmin.escapeHtml(item.numero_licitacion || 'Sin licitación vinculada') + ' · ' + SGPLAdmin.escapeHtml(item.dependencia_nombre || 'Dependencia no disponible') + ' · ' + SGPLAdmin.formatDateTime(item.fecha_envio) + '</p>'
          + '</div>'
          + '<div class="flex flex-wrap lg:justify-end items-center gap-2 shrink-0">' + markButton + actionHtml + '</div>'
          + '</div>'
          + '</article>';
      }).join('');
    }

    async function marcarLeida(idNotificacion, silent) {
      await SGPLAdmin.authFetch('/notificaciones/' + String(idNotificacion) + '/leida', { method: 'PATCH' });
      notificaciones = notificaciones.map(function (item) {
        if (String(item.id_notificacion) === String(idNotificacion)) {
          return Object.assign({}, item, { leida: true, fecha_lectura: new Date().toISOString() });
        }
        return item;
      });
      if (!silent) setFlash('Notificación marcada como leída.', 'ok');
      render();
    }

    async function loadNotificaciones() {
      const rows = document.getElementById('rows');
      rows.innerHTML = '<div class="px-6 py-8 text-sm text-center text-slate-500">Cargando notificaciones...</div>';
      try {
        const response = await SGPLAdmin.authFetch('/notificaciones/mias', { method: 'GET' });
        notificaciones = (response && response.data) || [];
        render();
      } catch (error) {
        document.getElementById('summary').textContent = 'Error al cargar';
        rows.innerHTML = '<div class="px-6 py-8 text-sm text-center text-red-600">No se pudieron cargar las notificaciones.</div>';
      }
    }

    document.getElementById('filters-form').addEventListener('submit', function (e) {
      e.preventDefault();
      render();
    });

    document.getElementById('mark-visible-read').addEventListener('click', async function () {
      const button = this;
      const pendientes = visibles.filter(function (item) { return !item.leida; });
      if (!pendientes.length) return;
      button.disabled = true;
      try {
        await Promise.all(pendientes.map(function (item) {
          return SGPLAdmin.authFetch('/notificaciones/' + String(item.id_notificacion) + '/leida', { method: 'PATCH' });
        }));
        notificaciones = notificaciones.map(function (item) {
          return pendientes.some(function (x) { return String(x.id_notificacion) === String(item.id_notificacion); })
            ? Object.assign({}, item, { leida: true, fecha_lectura: new Date().toISOString() })
            : item;
        });
        setFlash('Notificaciones visibles marcadas como leídas.', 'ok');
        render();
      } catch (error) {
        setFlash(error.message || 'No se pudieron marcar las notificaciones.', 'error');
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById('rows').addEventListener('click', async function (e) {
      const markButton = e.target.closest('button[data-mark-read]');
      if (markButton) {
        markButton.disabled = true;
        try {
          await marcarLeida(markButton.getAttribute('data-mark-read'), false);
        } catch (error) {
          setFlash(error.message || 'No se pudo marcar la notificación.', 'error');
          markButton.disabled = false;
        }
        return;
      }

      const actionLink = e.target.closest('a[data-open-action]');
      if (!actionLink) return;
      const item = notificaciones.find(function (x) {
        return String(x.id_notificacion) === String(actionLink.getAttribute('data-open-action'));
      });
      if (!item || item.leida) return;
      e.preventDefault();
      try {
        await marcarLeida(item.id_notificacion, true);
      } finally {
        window.location.href = actionLink.href;
      }
    });

    (async function init() {
      if (!SGPLAdmin.protectRoute()) return;
      const user = SGPLAdmin.getUser() || {};
      if (user.rol !== 'PROVEEDOR') {
        window.location.href = '/';
        return;
      }

      try {
        const meResp = await SGPLAdmin.authFetch('/me', { method: 'GET' });
        const me = (meResp && meResp.data) || null;
        if (!me || me.rol !== 'PROVEEDOR') {
          window.location.href = '/';
          return;
        }
        SGPLAdmin.setUser(me);
      } catch (_) {
        window.location.href = '/frontend/auth/login.html';
        return;
      }

      loadNotificaciones();
    })();
  </script>
</body>
</html>
